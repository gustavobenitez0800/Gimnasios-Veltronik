<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirmá tu cuenta</title>
</head>
<body style="margin:0; padding:0; background-color:#f3f4f6;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f3f4f6;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px; background-color:#ffffff; border:1px solid #e5e7eb; border-radius:12px;">
          <tr>
            <td align="center" style="padding:40px 32px 8px;">
              <img src="https://veltronik.com.ar/logo-claro.png" width="44" height="57" alt="Veltronik" style="display:block; border:0; outline:none; text-decoration:none;">
              <p style="margin:12px 0 0; font-family:Arial, Helvetica, sans-serif; font-size:18px; font-weight:bold; color:#111827;">Veltronik</p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:24px 32px 0; font-family:Arial, Helvetica, sans-serif;">
              <h1 style="margin:0; font-size:24px; line-height:1.3; color:#111827;">Confirmá tu cuenta</h1>
              <p style="margin:16px 0 0; font-size:16px; line-height:1.6; color:#4b5563;">
                Ya casi está. Tocá el botón para confirmar tu correo y entrar a Veltronik,
                el sistema de tu gimnasio.
              </p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:28px 32px 32px;">
              <a href="{{ .ConfirmationURL }}" style="display:inline-block; padding:14px 32px; background-color:#2563eb; border-radius:8px; font-family:Arial, Helvetica, sans-serif; font-size:16px; font-weight:bold; color:#ffffff; text-decoration:none;">Confirmar mi cuenta</a>
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px;"><div style="border-top:1px solid #e5e7eb; font-size:0; line-height:0;">&nbsp;</div></td>
          </tr>
          <tr>
            <td align="center" style="padding:20px 32px 32px; font-family:Arial, Helvetica, sans-serif; font-size:14px; line-height:1.6; color:#6b7280;">
              Si no creaste una cuenta en Veltronik, ignorá este correo.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
