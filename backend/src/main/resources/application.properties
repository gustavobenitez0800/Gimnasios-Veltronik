spring.application.name=v2-backend
server.port=${PORT:8080}

# === Compresión HTTP (gzip) — los listados grandes (socios/pagos) viajan ~5-10x más
# livianos hacia el frontend; el JSON comprime muy bien y el CPU extra es despreciable.
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024

# === Base de Datos (TODAS las credenciales vienen de variables de entorno) ===
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# === Pool de conexiones (HikariCP) — CRÍTICO para la latencia con Supabase ===
# Mantiene conexiones tibias y reutilizadas: evita pagar el TLS+auth de reconectar
# (cientos de ms cruzando regiones) en cada request.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.keepalive-time=120000
# Compatibilidad con el Transaction Pooler de Supabase (puerto 6543): el pooler en
# modo transaccion NO soporta prepared statements del lado del servidor.
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# === JPA / Hibernate ===
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# === Flyway Database Migrations ===
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1

# === JWT Validation (Usando Supabase JWKS) ===
veltronik.jwt.jwks-uri=${SUPABASE_URL}/auth/v1/.well-known/jwks.json

# === Supabase Admin (alta de empleados sin que se registren solos) ===
# La clave de SERVICIO de Supabase. Es la credencial más poderosa del proyecto: saltea
# todas las reglas de acceso. Vive SOLO acá, en el servidor — jamás en el frontend ni en
# el instalable.
# Sin ella, el alta de empleados sigue exigiendo que la persona se registre por su cuenta
# (el equipo se puede seguir armando, pero solo vinculando cuentas que ya existen).
veltronik.supabase.url=${SUPABASE_URL}
veltronik.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}

# === Mercado Pago (DEBEN setearse como variables de entorno) ===
mercadopago.access.token=${MP_ACCESS_TOKEN}
mercadopago.public.key=${MP_PUBLIC_KEY}
mercadopago.webhook.secret=${MP_WEBHOOK_SECRET}
# Válvula de lanzamiento: poner MP_ENFORCE_SIGNATURE=false destraba el webhook si la firma fallara. Volver a true al validar.
mercadopago.webhook.enforce-signature=${MP_ENFORCE_SIGNATURE:true}

# Fundador(es) — quién ve Mission Control y publica el rollout por anillos (ladrillo 7).
# Coma-separado. Debe ser el email con el que el fundador se loguea (Supabase/Google).
veltronik.founder-emails=${FOUNDER_EMAILS:gustavobenitezlink@gmail.com}

# Precio del plan BÁSICO (ARS) — el que se cobra hoy. Configurable sin tocar código
# (env var BILLING_MONTHLY_PRICE), igual que trial-days: subir un precio no debería
# requerir un deploy. OJO: cambiar esto afecta solo a las suscripciones NUEVAS; las
# vigentes tienen el monto grabado en su preapproval de Mercado Pago.
veltronik.billing.monthly-price=${BILLING_MONTHLY_PRICE:45000}
# Plan PREMIUM (básico + control de acceso con molinetes). Nace APAGADO: existe en el código
# para poder construirlo, pero no se ofrece como opción de compra hasta que esté terminado.
# El día que ande: BILLING_PREMIUM_AVAILABLE=true en Railway. Sin deploy, sin tocar el front.
#
# ⚠️ ANTES DE PRENDERLO falta una pieza: el checkout (SubscriptionController /checkout y
# MercadoPagoService) cobra SIEMPRE el precio del básico y no recibe qué plan se eligió. Con
# dos planes visibles, quien elija premium pagaría el precio del básico. Esa pieza va junto
# con el control de acceso, no antes: hoy no existe función premium que vender.
veltronik.billing.premium-price=${BILLING_PREMIUM_PRICE:80000}
veltronik.billing.premium-available=${BILLING_PREMIUM_AVAILABLE:false}
# Días de prueba gratuita de la PRIMERA sucursal (las adicionales pagan de inmediato).
# Configurable sin tocar código: cambiar acá o vía env var TRIAL_DAYS.
veltronik.billing.trial-days=${TRIAL_DAYS:14}

# === Spring Actuator (Health Check para Railway) ===
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=false

spring.flyway.ignore-missing-migrations=true
