spring.application.name=v2-backend
server.port=${PORT:8080}

# === Compresión HTTP (gzip) — los listados grandes (socios/pagos) viajan ~5-10x más
# livianos hacia el frontend; el JSON comprime muy bien y el CPU extra es despreciable.
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024

# === Base de Datos (TODAS las credenciales vienen de variables de entorno) ===
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# === Pool de conexiones (HikariCP) — CRÍTICO para la latencia con Supabase ===
# Mantiene conexiones tibias y reutilizadas: evita pagar el TLS+auth de reconectar
# (cientos de ms cruzando regiones) en cada request.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.keepalive-time=120000
# Compatibilidad con el Transaction Pooler de Supabase (puerto 6543): el pooler en
# modo transaccion NO soporta prepared statements del lado del servidor.
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# === JPA / Hibernate ===
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# === Flyway Database Migrations ===
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1

# === JWT Validation (Usando Supabase JWKS) ===
veltronik.jwt.jwks-uri=${SUPABASE_URL}/auth/v1/.well-known/jwks.json

# === Supabase Admin (alta de empleados sin que se registren solos) ===
# La clave de SERVICIO de Supabase. Es la credencial más poderosa del proyecto: saltea
# todas las reglas de acceso. Vive SOLO acá, en el servidor — jamás en el frontend ni en
# el instalable.
# Sin ella, el alta de empleados sigue exigiendo que la persona se registre por su cuenta
# (el equipo se puede seguir armando, pero solo vinculando cuentas que ya existen).
veltronik.supabase.url=${SUPABASE_URL}
veltronik.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}

# === Mercado Pago (DEBEN setearse como variables de entorno) ===
mercadopago.access.token=${MP_ACCESS_TOKEN}
mercadopago.public.key=${MP_PUBLIC_KEY}
mercadopago.webhook.secret=${MP_WEBHOOK_SECRET}
# Válvula de lanzamiento: poner MP_ENFORCE_SIGNATURE=false destraba el webhook si la firma fallara. Volver a true al validar.
mercadopago.webhook.enforce-signature=${MP_ENFORCE_SIGNATURE:true}

# Fundador(es) — quién ve Mission Control y publica el rollout por anillos (ladrillo 7).
# Coma-separado. Debe ser el email con el que el fundador se loguea (Supabase/Google).
veltronik.founder-emails=${FOUNDER_EMAILS:gustavobenitezlink@gmail.com}

# ─── PRECIOS ────────────────────────────────────────────────────────────────
#
# ⚠️ EL DEFAULT ES EL PRECIO DE VERDAD, Y ESO ES A PROPOSITO (2026-09-16).
#
# Hasta hoy estos tres valores vivian SOLO en la consola de Cloud Run, puestos a
# mano, y el repo decia otra cosa: 45000 cuando se cobraban 55000, el premium
# apagado cuando estaba prendido, y 80000 cuando valia 145000.
#
# Como falla eso: el dia que las variables de entorno se pierdan —se recrea el
# servicio, alguien las borra, se deploya por otra via— el precio vuelve EN
# SILENCIO a 45000. Los clientes nuevos pagarian 18% menos y nadie se enteraria.
# Ni siquiera el centinela de SubscriptionBillingService, que compara el cobro
# contra monthly-price: si ese tambien cayo a 45000, un cobro de 45000 cuadra.
#
# El precio NO es un secreto: esta publicado en veltronik.com.ar. No habia
# ninguna razon para que viviera solo en una consola.
#
# ⭐ Y el argumento de "cambiar el precio sin deploy" ya no se sostiene: la
# landing arma el precio EN TIEMPO DE COMPILACION, asi que un cambio de precio
# obliga igual a redeployar el sitio. Si hay que tocar el repo de todos modos,
# mejor que el numero este en el repo.
#
# La env var sigue existiendo para una urgencia (bajar un precio un domingo sin
# esperar un deploy). Pero si se pierde, el default ya es el correcto.
#
# ⚠️ Cambiar esto afecta solo a las suscripciones NUEVAS. Las vigentes tienen el
# monto grabado en su preapproval de Mercado Pago y se cambian una por una desde
# el panel ("Modificar precio" en la suscripcion).
#
# ⛔ AL CAMBIAR UN PRECIO, REDEPLOYAR LA LANDING EN VERCEL. Si no, el sitio sigue
# mostrando el viejo para siempre: alguien entra, ve un numero, se suscribe, y se
# le cobra otro.

veltronik.billing.monthly-price=${BILLING_MONTHLY_PRICE:55000}

# Plan PREMIUM: el basico mas el control de acceso con molinetes y reconocimiento
# facial. PRENDIDO desde septiembre de 2026.
#
# ✅ La advertencia que vivia aca ya no aplica y por eso se borro. Decia que el
# checkout cobraba SIEMPRE el precio del basico porque no recibia que plan se
# habia elegido — cierto cuando se escribio, falso desde que SubscriptionController
# pasa `planCatalog.resolverPedido(planPedido)` y MercadoPagoService usa
# `plan.price()`. Ese comentario mantuvo el premium apagado despues de que el
# problema estuviera resuelto.
#
# ⚠️ resolverPedido cae al BASICO si el plan pedido no esta `available`. O sea que
# apagar premium-available no solo lo esconde: tambien hace que quien lo pida
# igual termine pagando el basico. Es la red de seguridad, no un bug.

veltronik.billing.premium-price=${BILLING_PREMIUM_PRICE:145000}
veltronik.billing.premium-available=${BILLING_PREMIUM_AVAILABLE:true}

# Dias de prueba gratuita de la PRIMERA sucursal (las adicionales pagan de inmediato).
veltronik.billing.trial-days=${TRIAL_DAYS:14}

# === Spring Actuator (Health Check para Railway) ===
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=false

# === Trazabilidad: el sello del pedido en cada linea de log ===
# CorrelationIdFilter deja un identificador por pedido en el MDC; esto lo imprime al lado
# del nivel, en TODAS las lineas — incluidas las de Spring, Hibernate y las excepciones.
#
# Para que sirve: cuando un gimnasio avisa que algo no anda, en los logs de Cloud Run se
# filtra por ese sello y sale la historia completa de esa operacion, sin adivinar cuales de
# las lineas mezcladas de todos los clientes corresponden a ese pedido.
#
# El `:-` es el valor por defecto cuando no hay sello (tareas programadas, arranque).
logging.pattern.level=%5p [%X{corrId:-sin-sello}]

spring.flyway.ignore-missing-migrations=true
