appId: com.veltronik.gimnasio
productName: Veltronik
copyright: Copyright © 2026 Veltronik

# Archivos a incluir en el build
files:
  - "electron/**/*"
  # dist-desktop, NO dist (Fase 4). `dist/` es el bundle del portal web, con las
  # pantallas de cuenta y el SDK de Mercado Pago adentro; ese va a Vercel y no al
  # instalador. Lo produce `pnpm run build:desktop`.
  - "dist-desktop/**/*"
  - "assets/**/*"
  - "package.json"
  # Lo que NO va adentro del instalador. Solo se listan rutas que EXISTEN: había
  # cuatro excludes de carpetas borradas hace rato (api/, .github/, vercel.json,
  # .vercelignore) que no excluían nada y hacían pensar que seguían existiendo.
  # Explícito a propósito, aunque la lista de arriba ya es una allowlist: `dist/` existe
  # en la máquina de build (Vercel y el escritorio se compilan del mismo repo) y si
  # entrara al instalador se colaría el SDK de Mercado Pago por la puerta de atrás,
  # justo lo que la Fase 4 saca. Barato de dejar, caro de olvidar.
  - "!dist/**/*"
  - "!src/**/*"
  - "!public/**/*"
  - "!.git/**/*"
  - "!.env"
  - "!.env.*"
  - "!*.md"
  - "!vite.config.js"
  - "!eslint.config.js"

# Incluir dependencias de producción automáticamente
asar: true

# Archivos extra a copiar
extraResources:
  - from: "assets/"
    to: "assets/"

# Directorio de salida (instaladores). Relativo: el build de producción corre en
# GitHub Actions (runner Windows limpio), donde no existe el lock de Defender/OneDrive
# que rompía el empaquetado local. dist_electron está en .gitignore.
directories:
  output: dist_electron
  buildResources: build

# Auto-updates via GitHub Releases.
# releaseType: draft → el tag publica un BORRADOR (no lo ve el electron-updater de los
# clientes hasta que un humano lo publica desde GitHub). Es el freno de mano para una
# flota que se auto-actualiza: probás el .exe empaquetado en una máquina, y recién
# cuando confirmás que arranca, publicás el borrador y ahí sí propaga. Alineado con el
# rollout escalonado (ADR-007): ningún cliente recibe algo sin verificación humana previa.
publish:
  provider: github
  owner: gustavobenitez0800
  repo: gimnasios-veltronik
  releaseType: draft

# ============================================
# WINDOWS
# ============================================
win:
  # icon.png: versión cuadrada 1024x1024 del Logotipo Secundario (el builder la
  # convierte a .ico multi-resolución; un PNG no cuadrado se deformaría).
  icon: assets/icon.png
  target:
    - target: nsis
      arch:
        - x64
  # Metadatos profesionales
  legalTrademarks: "TM Veltronik"
  verifyUpdateCodeSignature: false # Permitir updates sin firma (por ahora)
  
  # Configuración de Firma Digital (Code Signing)
  # Se usará automáticamente si las variables de entorno CSC_LINK y CSC_KEY_PASSWORD están definidas
  # No es necesario configurarlo aquí explícitamente.

  artifactName: "Veltronik-Setup-${version}.${ext}"

# Instalador SILENCIOSO estilo Discord/Steam: sin asistente, sin pedir nada.
# El auto-update se aplica solo (el updater llama quitAndInstall en modo silencioso).
nsis:
  oneClick: true              # instala directo, sin wizard Next->Next ni elegir carpeta
  perMachine: false           # por-usuario (AppData), sin UAC/admin
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Veltronik"
  runAfterFinish: true        # abre Veltronik al terminar de instalar/actualizar

# ============================================
# MACOS
# ============================================
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: assets/icon.png
  artifactName: "Veltronik-${version}-${arch}.${ext}"
  category: public.app-category.business

dmg:
  title: Veltronik Platform
  icon: assets/icon.png

# ============================================
# LINUX
# ============================================
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: assets/icon.png
  artifactName: "Veltronik-${version}.${ext}"
  category: Office
  maintainer: veltronikcompany@gmail.com
  vendor: Veltronik

appImage:
  artifactName: "Veltronik-${version}.AppImage"

deb:
  depends:
    - gconf2
    - gconf-service
    - libnotify4
    - libappindicator1
    - libxtst6
    - libnss3
