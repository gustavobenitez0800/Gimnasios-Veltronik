<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: la app dibuja hasta los bordes en pantallas con notch/isla
         y el CSS usa env(safe-area-inset-*) para que nada quede tapado. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Veltronik - Plataforma de gestión para gimnasios. Socios, cuotas, clases, control de acceso, pagos y reportes." />
    <meta name="keywords" content="gestión gimnasio, software para gimnasios, control de acceso, cuotas, socios, Veltronik" />
    <meta name="author" content="Veltronik" />
    <!-- ⛔ EL PORTAL NO SE INDEXA, Y NO ES UNA PRECAUCIÓN VAGA.
         Esto es la APLICACIÓN: la pantalla de login de los clientes, el check-in por QR que
         escanean los socios, el muro de cobro. Nada de eso tiene por qué aparecer en Google
         — y si aparece, lo que pasa es lo contrario de lo que queremos: alguien que busca
         "software para gimnasios" cae en un formulario de login que no entiende, en vez de
         en veltronik.com.ar, que es la página hecha para explicarle qué es esto.

         ⚠️ Y POR ESO NO HAY UN robots.txt CON Disallow ACÁ. Suena más contundente y es peor:
         un Disallow impide que el buscador ENTRE, así que nunca llega a leer este noindex —
         y una URL que alguien linkeó desde afuera puede terminar indexada igual, sin título
         ni descripción, que es la peor versión posible. Para que no se indexe hay que
         dejarlo pasar y que lea el cartel. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Open Graph -->
    <meta property="og:title" content="Veltronik | Plataforma de Gestión de Negocios" />
    <meta property="og:description" content="Administra tu gimnasio con la plataforma más completa. Socios, cuotas, clases, control de acceso y reportes." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://veltronik-v2.vercel.app" />
    <meta property="og:image" content="./assets/LogotipoSecundario.png" />

    <title>Veltronik | Plataforma de Gestión</title>
    <link rel="icon" type="image/png" href="./assets/LogotipoSecundario.png" />
    <meta name="theme-color" content="#0ea5e9" />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
