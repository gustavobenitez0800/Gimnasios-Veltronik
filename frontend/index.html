<!DOCTYPE html>

  <head>

    <!-- Open Graph -->

    <meta name="theme-color" content="#0ea5e9" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
