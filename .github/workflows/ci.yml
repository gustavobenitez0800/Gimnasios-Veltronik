name: CI

# Regla innegociable #9 (docs/ARCHITECTURE.md): sin verde no hay merge.
# Corre en cada push a main y en cada PR. Complementa a release.yml (que solo
# publica el instalador Electron por tags) — hasta ahora NO había CI de tests.
#
# Backend: mvn verify corre los tests completos, incluyendo:
#   - ApplicationBootTest: arranque real con Postgres embebido (binarios linux
#     ya declarados en el pom) → aplica TODAS las migraciones Flyway + validate.
#   - ArchitectureTest: límites entre módulos + higiene (sin System.out, sin
#     java.util.logging, sin @Autowired ni @Value en campos) + la regla que exige
#     que toda entidad de un vertical herede de TenantAwareEntity (el aislamiento
#     entre negocios). El build se pone rojo solo.
# Frontend: lint (no-console y demás reglas) + tests (vitest) + build de Vite.

on:
  push:
    # ⚠️ TAMBIÉN EN LAS RAMAS, y no solo en main.
    #
    # Antes esto era `[main]` a secas. Como acá se mergea empujando la rama a main
    # (`git push origin <rama>:main`) y no por pull request, CI no veía NADA hasta después
    # del merge: trece commits llegaron sin pasar por él y main quedó en rojo con un test
    # que solo falla en Node 20 —el de CI—, no en la máquina de quien lo escribió.
    #
    # El costo son minutos; el beneficio es que el rojo aparece en la rama, que es donde se
    # arregla sin que nadie más lo vea.
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request: {}
  workflow_dispatch: {}

# Solo lee el código: el repo es público y cualquiera puede abrir un PR que corra esto.
# Sin esta línea el token de cada corrida tenía los permisos por defecto del repositorio.
permissions:
  contents: read

# Un push nuevo cancela el run anterior de la misma rama (no gastar minutos al pedo).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # La JVM de producción corre en hora Argentina (fix timezone, Dockerfile).
      # El runner es UTC: fijamos TZ para que los tests corran como en prod.
      TZ: America/Argentina/Buenos_Aires
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Tests + verificación
        run: ./mvnw -B verify

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install deps
        # --frozen-lockfile: el lock se regeneró en Fase 0 (2026-07-01) y ahora
        # está sincronizado con package.json → builds 100% reproducibles.
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: El programa de la cajita del molinete compila
        # Es Python (MicroPython) y la app se lo instala a la cajita de cada gimnasio: un error
        # de sintaxis acá deja un molinete sin contestar. MicroPython es un subconjunto de
        # Python 3, así que alcanza con que Python 3 lo compile. Ver docs/molinete/cajita.md.
        run: python3 -m py_compile firmware/cajita-molinete/main.py

      - name: Tests
        # Vitest. Hoy cubre el depósito de la caché de consultas: que refrescar no borre
        # (o la pantalla queda en blanco en cada ciclo), que invalidar un módulo no toque
        # a los otros, y que la caché tenga techo (los terminales no se apagan nunca).
        run: pnpm test

      - name: Build web (vite)
        # Sin secrets: las VITE_* quedan undefined y el bundle no es usable en
        # runtime, pero el build DEBE compilar. Los bundles reales (con secrets)
        # los produce release.yml.
        run: pnpm run build

      - name: Build de escritorio (vite)
        # El otro entry point (Fase 4). Compila aparte, así que puede romperse solo.
        run: pnpm run build:desktop

      - name: El bundle de escritorio no lleva código de cobro
        # El criterio de aceptación de la Fase 4. Acá es donde tiene que doler: si un
        # import arrastra de nuevo el SDK de Mercado Pago al instalador, el PR se pone
        # rojo antes del merge, no en el release.
        run: pnpm run check:desktop-bundle
