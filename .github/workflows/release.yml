name: Release Electron (Windows)

# Publica un Release de GitHub con el instalador de Veltronik cuando se empuja
# un tag de versión (vX.Y.Z). El electron-updater de los clientes consulta estos
# Releases para auto-actualizarse — la RAMA no importa, solo el Release publicado.
#
# Por qué en la nube: el runner windows-latest es limpio (admin, sin Windows Defender
# bloqueando app.asar, symlinks de winCodeSign permitidos). Resuelve de raíz el fallo
# de empaquetado local. Releases futuros = un `git push` del tag.
#
# El workflow NO compila Java. Hasta acá arrancaba con un "Setup Java 17" + un paso que
# corría build-tools\build-backend.ps1 para armar el cerebro embebido (jar + JRE). Ese
# script se fue con la baja del circuito offline (V43) y el paso quedó apuntándole: TODO
# release fallaba en el segundo step. Además el artefacto que producía (resources/backend,
# ~330MB) ya no lo empaquetaba nadie — electron-builder.yml solo lleva assets/ como
# extraResources. Si algún día vuelve un runtime embebido, se agrega acá de nuevo.

on:
  push:
    tags:
      - 'v*'
  # A mano, desde la pestaña Actions. Por defecto NO publica: corre el pipeline
  # entero (incluido el empaquetado, que es lo único que no se puede probar en una
  # máquina local por el lock de Defender/OneDrive) y tira el .exe a la basura. Sirve
  # para saber si el release funciona SIN dejar Releases borrador dando vueltas ni
  # pisar un tag ya publicado. Elegí "always" solo si querés publicar de verdad.
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar un Release borrador al terminar'
        type: choice
        default: 'never'
        options:
          - never
          - always

permissions:
  contents: write          # para publicar la copia del Release en ESTE repo (ver "la mudanza")

# ⭐ LA MUDANZA: los instaladores viven en un repo aparte.
#
# Cada escritorio instalado lleva grabada la dirección donde pregunta por versiones nuevas
# (sale de `publish` en electron-builder.yml). Esa dirección era este repo, y por eso este
# repo no podía ser privado: el día que lo fuera, ningún cliente volvía a actualizarse.
#
# Desde la versión puente, el instalador mira `veltronik-releases`, un repo público que solo
# tiene instaladores. Mientras queden equipos con una versión anterior a la puente —que
# siguen mirando acá— cada versión se publica EN LOS DOS: en el repo nuevo, y una copia en
# este. El día que este repo pase a privado se sacan el paso de la copia y su verificación
# (están marcados con "MIENTRAS DURE LA MUDANZA").
env:
  REPO_DE_VERSIONES: gustavobenitez0800/veltronik-releases

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comprobar que está el token del repo de versiones
        # El token integrado del runner solo escribe en ESTE repo, y los instaladores van a
        # otro: hace falta RELEASES_TOKEN (un token fino con permiso de Contents sobre
        # veltronik-releases y nada más). Sin él, electron-builder arma el instalador durante
        # minutos para recién fallar al subirlo, con un error que no dice qué falta. Se corta
        # acá, antes de gastar el build, y con el motivo a la vista.
        if: ${{ github.event_name == 'push' || inputs.publish == 'always' }}
        shell: bash
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::error::Falta el secreto RELEASES_TOKEN (o vencio). Sin el no se puede publicar en $REPO_DE_VERSIONES. Ver TAREAS-MANUALES.md."
            exit 1
          fi
          echo "Hay token para publicar en $REPO_DE_VERSIONES."

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install deps
        # --frozen-lockfile: el lock se regeneró en Fase 0 (2026-07-01) y quedó
        # sincronizado con package.json → releases 100% reproducibles.
        run: pnpm install --frozen-lockfile

      - name: Build de escritorio (vite)
        # Fase 4: el instalador NO lleva el bundle del portal. `build:desktop` compila
        # dist-desktop/ (solo pantallas de operación) y es lo único que empaqueta
        # electron-builder. El build web (`pnpm run build` → dist/) lo hace Vercel.
        #
        # Vite inyecta las VITE_* en build-time. Vienen de GitHub Secrets (NUNCA del
        # repo: los .env están gitignoreados). Sin esto, el bundle arranca con
        # "Missing Supabase environment variables" y la app queda en pantalla negra.
        # VITE_MP_PUBLIC_KEY ya no hace falta acá —el escritorio no cobra— pero se deja
        # pasada por si alguna pantalla de operación la mirara: cuesta nada.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_MP_PUBLIC_KEY: ${{ secrets.VITE_MP_PUBLIC_KEY }}
        run: pnpm run build:desktop

      - name: Verificar que el bundle no lleve código de cobro
        # El criterio de aceptación de la Fase 4, en el pipeline: si un import vuelve a
        # arrastrar el SDK de Mercado Pago al instalador, el release se pone rojo ACÁ y
        # no seis meses después en la máquina de un cliente.
        run: pnpm run check:desktop-bundle

      - name: Build & publish Electron (Windows)
        env:
          # El token del repo de versiones: electron-builder publica en el repo que dice
          # `publish` en electron-builder.yml, que ya no es este. (A mano y con "never" no
          # publica nada, y entonces da igual que el token esté.)
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # Sin firma de código (coincide con verifyUpdateCodeSignature: false del yml).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        # Por tag (el camino real de release): SIEMPRE publica — el comportamiento de
        # siempre, intacto. A mano: lo que elijas en el input, que por defecto es "never".
        #
        # El orden de la expresión importa: 'always' cuelga de la rama del TAG, no del
        # fallback. Así, si el input llegara vacío por lo que sea, el comando queda
        # malformado y el run se pone rojo — nunca se cae hacia publicar sin querer.
        # La resuelve Actions antes de que la vea la shell: no depende de pwsh ni cmd.
        run: npx electron-builder --win --publish ${{ github.event_name == 'push' && 'always' || inputs.publish }}

      - name: Sacar el Release de borrador
        # ⭐ LA BARRERA. electron-builder crea el Release en BORRADOR, y publicarlo era
        # un paso a mano que se salteó CUATRO DE CUATRO VECES. La 2.6.31 estuvo 16 horas
        # sin que ningún cliente pudiera recibirla; la 2.6.32 apareció en borrador otra
        # vez. Un instalador de 88 MB construido y verificado que nadie recibe es lo
        # mismo que no haberlo hecho.
        #
        # Por qué acá y no en electron-builder: su opción `releaseType` fija el estado
        # al CREAR el Release, y GitHub igual lo deja en borrador cuando el tag no
        # existía antes. Corregirlo después es lo único que funciona siempre.
        if: ${{ github.event_name == 'push' || inputs.publish == 'always' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            # A mano: el tag es el que electron-builder derivó del package.json.
            TAG="v$(node -p "require('./package.json').version")"
          fi
          # Los pasos que siguen publican y verifican el mismo tag: se decide una sola vez.
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Publicando $TAG en $REPO_DE_VERSIONES"
          gh release edit "$TAG" --repo "$REPO_DE_VERSIONES" --draft=false --latest
          gh release view "$TAG" --repo "$REPO_DE_VERSIONES" --json tagName,isDraft --jq '"tag: \(.tagName)  borrador: \(.isDraft)"'

      - name: Publicar una copia en este repo (MIENTRAS DURE LA MUDANZA)
        # Los equipos con una versión anterior a la puente siguen preguntando acá. Sin esta
        # copia no les llega nunca la versión que los pasa al repo nuevo — ni ninguna otra.
        #
        # Son los MISMOS tres archivos que electron-builder acaba de subir al repo nuevo: el
        # latest.yml lleva el nombre, el tamaño y el sha512 del instalador, nada que dependa
        # del repo. Si ya existía un Release con este tag (un reintento del run), se le
        # reemplazan los archivos en vez de fallar.
        #
        # ⛔ SE SACA EL DÍA QUE ESTE REPO PASE A PRIVADO (junto con su parte de la verificación
        # de abajo), y no antes: mientras este repo sea público y quede un solo equipo sin
        # pasar por la puente, esto es lo único que lo mantiene al día.
        if: ${{ github.event_name == 'push' || inputs.publish == 'always' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          ARCHIVOS=(dist_electron/latest.yml dist_electron/Veltronik-Setup-*.exe dist_electron/Veltronik-Setup-*.exe.blockmap)
          ls -la "${ARCHIVOS[@]}"
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release upload "$TAG" "${ARCHIVOS[@]}" --repo "${{ github.repository }}" --clobber
            gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --latest
          else
            gh release create "$TAG" "${ARCHIVOS[@]}" --repo "${{ github.repository }}" \
              --title "$TAG" --latest \
              --notes "Copia de https://github.com/$REPO_DE_VERSIONES/releases/tag/$TAG para los equipos que todavia buscan las versiones en este repo."
          fi
          gh release view "$TAG" --repo "${{ github.repository }}" --json tagName,isDraft --jq '"copia — tag: \(.tagName)  borrador: \(.isDraft)"'

      - name: Verificar que el actualizador de los clientes lo vea
        # ⭐ LA VERIFICACIÓN QUE DE VERDAD IMPORTA. Que el Release diga "Latest" en la
        # web NO alcanza: electron-updater no mira la página, descarga el latest.yml de
        # releases/latest/download/. Si ese archivo no expone la versión nueva, los
        # clientes se quedan donde están aunque todo lo demás haya salido verde.
        #
        # Reintenta porque GitHub tarda unos segundos en mover el puntero de "latest".
        # Si igual no aparece, ESTE PASO PONE EL RUN EN ROJO — que es el punto: enterarse
        # en el pipeline y no dentro de tres semanas, cuando un cliente pregunte por qué
        # no le llegó una función.
        #
        # ⭐ SE MIRAN LAS DOS DIRECCIONES, porque hay equipos mirando cada una: los que ya
        # pasaron por la versión puente (repo de versiones) y los que todavía no (este repo,
        # MIENTRAS DURE LA MUDANZA). Que falte en cualquiera de las dos pone el run en rojo:
        # si falta en la vieja, justo los equipos que hay que mudar se quedan sin mudar.
        if: ${{ github.event_name == 'push' || inputs.publish == 'always' }}
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          FALLO=0
          for REPO in "$REPO_DE_VERSIONES" "${{ github.repository }}"; do
            URL="https://github.com/$REPO/releases/latest/download/latest.yml"
            echo "Buscando la version $VERSION en $URL"
            VISTO=0
            for intento in 1 2 3 4 5 6; do
              YML="$(curl -sL --max-time 30 "$URL" || true)"
              if echo "$YML" | grep -q "^version: ${VERSION}$"; then
                echo "OK — en $REPO el actualizador ve la $VERSION."
                VISTO=1
                break
              fi
              echo "  intento $intento: todavia no. Espero 10s..."
              sleep 10
            done
            if [ "$VISTO" != "1" ]; then
              echo "::error::En $REPO el latest.yml NO expone la version $VERSION. Los equipos que miran ahi NO van a recibir esta release."
              echo "--- lo que devolvio el latest.yml ---"
              echo "$YML"
              FALLO=1
            fi
          done
          exit $FALLO
