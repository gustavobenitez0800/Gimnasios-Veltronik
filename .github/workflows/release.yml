name: Release Electron (Windows)

# Publica un Release de GitHub con el instalador de Veltronik cuando se empuja
# un tag de versión (vX.Y.Z). El electron-updater de los clientes consulta estos
# Releases para auto-actualizarse — la RAMA no importa, solo el Release publicado.
#
# Por qué en la nube: el runner windows-latest es limpio (admin, sin Windows Defender
# bloqueando app.asar, symlinks de winCodeSign permitidos). Resuelve de raíz el fallo
# de empaquetado local. Releases futuros = un `git push` del tag.
#
# El workflow NO compila Java. Hasta acá arrancaba con un "Setup Java 17" + un paso que
# corría build-tools\build-backend.ps1 para armar el cerebro embebido (jar + JRE). Ese
# script se fue con la baja del circuito offline (V43) y el paso quedó apuntándole: TODO
# release fallaba en el segundo step. Además el artefacto que producía (resources/backend,
# ~330MB) ya no lo empaquetaba nadie — electron-builder.yml solo lleva assets/ como
# extraResources. Si algún día vuelve un runtime embebido, se agrega acá de nuevo.

on:
  push:
    tags:
      - 'v*'
  # A mano, desde la pestaña Actions. Por defecto NO publica: corre el pipeline
  # entero (incluido el empaquetado, que es lo único que no se puede probar en una
  # máquina local por el lock de Defender/OneDrive) y tira el .exe a la basura. Sirve
  # para saber si el release funciona SIN dejar Releases borrador dando vueltas ni
  # pisar un tag ya publicado. Elegí "always" solo si querés publicar de verdad.
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar un Release borrador al terminar'
        type: choice
        default: 'never'
        options:
          - never
          - always

permissions:
  contents: write          # necesario para que electron-builder cree el Release

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install deps
        # --frozen-lockfile: el lock se regeneró en Fase 0 (2026-07-01) y quedó
        # sincronizado con package.json → releases 100% reproducibles.
        run: pnpm install --frozen-lockfile

      - name: Build de escritorio (vite)
        # Fase 4: el instalador NO lleva el bundle del portal. `build:desktop` compila
        # dist-desktop/ (solo pantallas de operación) y es lo único que empaqueta
        # electron-builder. El build web (`pnpm run build` → dist/) lo hace Vercel.
        #
        # Vite inyecta las VITE_* en build-time. Vienen de GitHub Secrets (NUNCA del
        # repo: los .env están gitignoreados). Sin esto, el bundle arranca con
        # "Missing Supabase environment variables" y la app queda en pantalla negra.
        # VITE_MP_PUBLIC_KEY ya no hace falta acá —el escritorio no cobra— pero se deja
        # pasada por si alguna pantalla de operación la mirara: cuesta nada.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_MP_PUBLIC_KEY: ${{ secrets.VITE_MP_PUBLIC_KEY }}
        run: pnpm run build:desktop

      - name: Verificar que el bundle no lleve código de cobro
        # El criterio de aceptación de la Fase 4, en el pipeline: si un import vuelve a
        # arrastrar el SDK de Mercado Pago al instalador, el release se pone rojo ACÁ y
        # no seis meses después en la máquina de un cliente.
        run: pnpm run check:desktop-bundle

      - name: Build & publish Electron (Windows)
        env:
          # Token integrado del runner: permite publicar el Release sin PAT manual.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sin firma de código (coincide con verifyUpdateCodeSignature: false del yml).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        # Por tag (el camino real de release): SIEMPRE publica — el comportamiento de
        # siempre, intacto. A mano: lo que elijas en el input, que por defecto es "never".
        #
        # El orden de la expresión importa: 'always' cuelga de la rama del TAG, no del
        # fallback. Así, si el input llegara vacío por lo que sea, el comando queda
        # malformado y el run se pone rojo — nunca se cae hacia publicar sin querer.
        # La resuelve Actions antes de que la vea la shell: no depende de pwsh ni cmd.
        run: npx electron-builder --win --publish ${{ github.event_name == 'push' && 'always' || inputs.publish }}
