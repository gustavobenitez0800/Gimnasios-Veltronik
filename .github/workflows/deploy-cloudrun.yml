name: Deploy to Google Cloud Run (Backend)

# Se ejecuta manualmente o cada vez que hay un push a main
on:
  push:
    branches: [main]
    paths:
      - 'backend/**' # Solo redespliega si hay cambios en el backend
  workflow_dispatch: {}

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: southamerica-east1
  REPO_NAME: veltronik-backend-repo
  SERVICE_NAME: v2-backend

jobs:
  deploy:
    name: Deploy Backend a Cloud Run
    runs-on: ubuntu-latest
    
    # Necesario para Workload Identity Federation (el login seguro con GCP)
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Autenticación en Google Cloud (Workload Identity)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configurar Docker para Artifact Registry
        run: |
          echo ${{ steps.auth.outputs.access_token }} | docker login -u oauth2accesstoken --password-stdin https://${{ env.REGION }}-docker.pkg.dev

      - name: Construir y Subir Imagen Docker (Build & Push)
        # La ruta del backend
        working-directory: backend
        run: |
          IMAGE_URL="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build -t $IMAGE_URL .
          docker push $IMAGE_URL
          
          # Guardamos la variable para el siguiente step
          echo "IMAGE_URL=$IMAGE_URL" >> $GITHUB_ENV

      - name: Deploy a Cloud Run (São Paulo)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_URL }}
          # Ajustes para Spring Boot en Cloud Run.
          #
          # `--cpu-boost` da CPU extra durante el arranque. En una JVM eso NO es un lujo:
          # Spring más las migraciones de Flyway tardan lo suyo aunque la instancia arranque.
          #
          # ⭐ POR QUÉ min-instances ES 1 Y NO 0 — MEDIDO, NO SUPUESTO (2026-09-05)
          #
          # Estuvo en 0 para ahorrar, con este razonamiento: "el gimnasio consulta cada 15
          # segundos mientras está abierto, así que la instancia se mantiene viva sola
          # durante el día y solo se apaga de noche". El razonamiento era correcto y aun así
          # el resultado era malo: lo que no se veía es cuánto duele esa única vez.
          #
          # La primera apertura del día, medida en producción desde el navegador del dueño:
          #
          #     8 pedidos salen juntos a los ~1362 ms
          #     todos duran 19173–20004 ms   ← el timeout de axios es exactamente 20000
          #     el reintento a los 21884 ms  ← 94–174 ms
          #
          # O sea que el arranque en frío no era "un ratito más": los ocho pedidos MORÍAN
          # por timeout y recién el reintento levantaba la pantalla. Entre ellos estaba
          # /api/public/payment-config, que ni siquiera lleva sesión — así que no había
          # nada del lado del cliente que arreglar. Era la JVM arrancando, y punto.
          #
          # ⚠️ Antes de esa medición yo había sondeado /actuator/health tras 17 y 45 minutos
          # sin tráfico y me dio 267 y 281 ms, y con eso di el arranque en frío por
          # descartado. Estaba mal: mis sondas cayeron en momentos en que la instancia
          # seguía viva. Una sonda sintética no puede desmentir al que sufre el problema.
          #
          # Esto SE PAGA TODOS LOS MESES (una instancia encendida las 24 h). Fue una
          # decisión explícita del dueño con el número a la vista. Si alguien lo vuelve a
          # poner en 0 para ahorrar, que sepa que está reintroduciendo 20 segundos de
          # pantalla muerta cada mañana.
          flags: >-
            --allow-unauthenticated
            --memory=1024Mi
            --cpu=1
            --cpu-boost
            --min-instances=1
            --max-instances=3
          # Inyectar las variables de entorno de producción desde los Secrets de GitHub.
          #
          # ⚠️ TRES COSAS QUE HAY QUE SABER ANTES DE TOCAR ESTA LISTA:
          #
          # 1. NO PONER `PORT`. Es un nombre RESERVADO en Cloud Run: lo inyecta él y rechaza
          #    el despliegue si se lo mandamos. La app ya lo lee con default
          #    (`${PORT:8080}` en application.properties), así que no hace falta.
          #
          # 2. ESTA LISTA NO REEMPLAZA: FUSIONA. El action corre `--update-env-vars`, así que
          #    lo que ya esté seteado en el servicio SOBREVIVE aunque no figure acá. Tiene un
          #    lado bueno y uno malo: no se pierde nada seteado a mano en la consola, pero
          #    BORRAR una variable de esta lista NO la borra del servicio. Para sacarla de
          #    verdad hay que hacerlo en Cloud Run (o con `--remove-env-vars`).
          #
          # 3. ⚠️ UNA VARIABLE CON EL SECRET VACÍO ES PEOR QUE NO PONERLA. Si el Secret no
          #    existe en GitHub, `${{ secrets.X }}` se resuelve a cadena vacía y pisa el
          #    default de application.properties con "". Por eso NO están acá
          #    FOUNDER_EMAILS, TRIAL_DAYS, MP_ENFORCE_SIGNATURE ni los BILLING_*: sus
          #    defaults ya son los valores correctos (45000 el plan básico, premium oculto,
          #    firma de webhook exigida, 14 días de prueba). Agregarlos sin cargar el Secret
          #    los rompería en silencio.
          #
          # Nota: `JWT_SECRET` estaba acá por herencia de Railway y se sacó — este backend
          # valida los tokens con JWKS asimétrico (veltronik.jwt.jwks-uri), no con un secreto
          # compartido, así que nunca lo leyó nadie.
          env_vars: |-
            DB_URL=${{ secrets.DB_URL }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            MP_ACCESS_TOKEN=${{ secrets.MP_ACCESS_TOKEN }}
            MP_PUBLIC_KEY=${{ secrets.MP_PUBLIC_KEY }}
            MP_WEBHOOK_SECRET=${{ secrets.MP_WEBHOOK_SECRET }}
            SPRING_PROFILES_ACTIVE=prod
            # ⚠️ ESTA ES LA VARIABLE QUE FALTABA Y DEJABA EL SERVIDOR INUTILIZABLE.
            #
            # `FRONTEND_URL` decide qué orígenes acepta CORS, y NO se lee desde
            # application.properties sino con un @Value directo en SecurityConfig — por eso
            # no aparece al revisar el archivo de properties. Su default es
            # `http://localhost:5173`, así que sin ella Cloud Run rechazaba TODOS los
            # preflight con 403: medido contra el servicio recién desplegado.
            #
            # Va como valor literal y no como Secret a propósito: no es información secreta,
            # y un Secret inexistente se resolvería a cadena vacía y volvería a romper CORS.
            #
            # ⭐ POR QUÉ `*` Y NO LA URL DEL PORTAL: la app de escritorio carga desde
            # `file://`, así que manda `Origin: null`. Una lista con la URL del portal NO
            # matchea `null` y dejaría al mostrador sin poder hablar con el backend. Es lo
            # mismo que ya tiene Railway en producción (responde `allow-origin: null`).
            # No abre un hueco: la autenticación es por Bearer token y
            # `setAllowCredentials(false)`, así que no se refleja ninguna credencial.
            FRONTEND_URL=*

      # ─────────────────────────────────────────────────────────────────────
      # ⭐ QUE EL DEPLOY DIGA "OK" NO SIGNIFICA QUE EL BACKEND ANDE.
      #
      # `gcloud run deploy` da por buena la revisión apenas el contenedor acepta
      # conexiones en su puerto. Un Spring Boot puede levantar el puerto y aun así
      # tener la mitad de la configuración sin resolver — y eso recién se nota
      # cuando un gimnasio no puede cobrar.
      #
      # Estas dos consultas son la diferencia entre "desplegado" y "funcionando":
      #
      #   · /actuator/health         → la app arrancó y la BASE responde.
      #   · /api/public/payment-config → la config de Mercado Pago se resolvió de
      #     verdad. ⚠️ `MP_PUBLIC_KEY` y `MP_ACCESS_TOKEN` NO tienen default en
      #     application.properties: si el Secret falta, el placeholder queda sin
      #     resolver y los cobros se caen. Este endpoint lo delata acá y no en
      #     el mostrador.
      # ─────────────────────────────────────────────────────────────────────
      - name: Verificar que el backend REALMENTE responde
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          echo "Backend desplegado en: $URL"
          echo "### Backend en Cloud Run" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$URL\`" >> "$GITHUB_STEP_SUMMARY"

          # Arranque en frío de una JVM: se le dan hasta ~2 minutos antes de fallar.
          echo "Esperando a que la instancia levante..."
          for intento in $(seq 1 24); do
            estado=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL/actuator/health" || echo 000)
            if [ "$estado" = "200" ]; then
              echo "OK: /actuator/health respondió 200 (intento $intento)"
              break
            fi
            if [ "$intento" = "24" ]; then
              echo "FALLA: /actuator/health nunca respondió 200 (último: $estado)"
              exit 1
            fi
            sleep 5
          done

          # La config de Mercado Pago, que es la que no tiene red de seguridad.
          echo "Comprobando la configuración de Mercado Pago..."
          cuerpo=$(curl -s --max-time 20 "$URL/api/public/payment-config" || echo '')
          echo "Respuesta: $(echo "$cuerpo" | head -c 120)"
          case "$cuerpo" in
            *APP_USR*|*TEST-*)
              echo "OK: la clave pública de Mercado Pago llegó resuelta." ;;
            *)
              echo "FALLA: /api/public/payment-config no devolvió una clave usable."
              echo "Revisar que los Secrets MP_ACCESS_TOKEN, MP_PUBLIC_KEY y"
              echo "MP_WEBHOOK_SECRET existan en GitHub: no tienen default y sin"
              echo "ellos el gimnasio no puede cobrar."
              exit 1 ;;
          esac

          # ⭐ CORS CON `Origin: null` — LA COMPROBACIÓN QUE MÁS IMPORTA.
          #
          # La app de escritorio carga desde `file://`, así que manda `Origin: null`. Si CORS
          # no lo acepta, el navegador bloquea CADA pedido y el mostrador queda mudo — con el
          # backend perfectamente sano y respondiendo a curl. Es justo el modo de falla que
          # no se ve desde afuera: /actuator/health da 200 y el gimnasio no puede trabajar.
          #
          # Paso de verdad: la primera vez que se desplegó esto, faltaba `FRONTEND_URL` y
          # TODOS los preflight daban 403.
          echo "Comprobando CORS para el escritorio (Origin: null)..."
          preflight=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS --max-time 20 \
            -H "Origin: null" \
            -H "Access-Control-Request-Method: GET" \
            -H "Access-Control-Request-Headers: authorization,x-tenant-id" \
            "$URL/api/gym/members" || echo 000)
          if [ "$preflight" != "200" ]; then
            echo "FALLA: el preflight con Origin null devolvió $preflight (se esperaba 200)."
            echo "El escritorio no podría hablar con este backend. Revisar FRONTEND_URL."
            exit 1
          fi
          echo "OK: el preflight del escritorio pasa."

          echo "El backend está desplegado Y respondiendo."
